<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
		<title>Offline · Bugs</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #ffffff;
				--fg: #27272a;
				--muted: #71717a;
				--btn: #18181b;
				--btn-fg: #ffffff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #09090b;
					--fg: #e4e4e7;
					--muted: #a1a1aa;
					--btn: #f4f4f5;
					--btn-fg: #18181b;
				}
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
				box-sizing: border-box;
				background: var(--bg);
				color: var(--fg);
				font:
					15px/1.5 ui-sans-serif,
					system-ui,
					sans-serif;
				text-align: center;
			}
			img {
				width: 48px;
				height: 48px;
				opacity: 0.7;
			}
			h1 {
				font-size: 18px;
				margin: 12px 0 4px;
			}
			p {
				margin: 0 0 20px;
				color: var(--muted);
			}
			button {
				font: inherit;
				border: 0;
				border-radius: 8px;
				padding: 12px 20px;
				min-height: 44px;
				background: var(--btn);
				color: var(--btn-fg);
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icon.svg" alt="" />
			<h1>You're offline</h1>
			<p>Bugs needs a connection to load issues. It reloads by itself once you're back online.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
		<script>
			addEventListener('online', () => location.reload());
		</script>
	</body>
</html>
